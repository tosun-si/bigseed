# A BigSeed pack, as generated by the agent and approved: the data files seed an environment and run the tests.
name: daily-failures
version: 1
description: Daily failures per feature, for the monitoring dashboard

sources:
  - { path: inputs/rules.md, sha256: 5290fbc8b59183582be5adaa8945d8ebd665d189a2606f63208f6768d64aa31b }
  - { path: inputs/build_daily_failures.sql, sha256: 412c8bd92908dbafbcb54a6e1b4b3a0137db3cc0dbfd6b72fcc9ce9571190a6d }

rules:
  - id: R1
    description: A feature with at least 2 failed jobs on a day has one row for that day, with its number of failures
    source: inputs/rules.md#L5
    scenarios: [monitoring/daily_failures.bigtesty.yaml::r1_one_row_per_day_and_feature_with_enough_failures]
  - id: R2
    description: A feature with fewer than 2 failed jobs on a day is not reported for that day
    source: inputs/rules.md#L6
    scenarios: [monitoring/daily_failures.bigtesty.yaml::r2_one_failure_is_not_reported]
  - id: R3
    description: A failed job without feature name is ignored
    source: inputs/rules.md#L7
    scenarios: [monitoring/daily_failures.bigtesty.yaml::r3_failure_without_feature_is_ignored]

# The input tables only: the output tables are written by the code under test.
data:
  monitoring.job_failure: data/monitoring/job_failure.json

environments:
  uat:
    project: my-uat-project
    datasets: { monitoring: monitoring_uat }
  prod:
    project: my-prod-project
    datasets: { monitoring: monitoring }
    seedable: false
